services:
  - type: web
    name: ife-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: ife-ai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ASSISTANT_NAME
        value: My AI
      - key: COOKIE_SECURE
        value: "1"
      - key: AI_SYSTEM_PROMPT
        value: You are My AI, a helpful personal assistant. Be clear and friendly.

databases:
  - name: ife-ai-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
